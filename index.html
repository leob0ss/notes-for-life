<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Notes for Life</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%23F3CD6F"/><rect width="32" height="7" fill="%23e0ba5a"/></svg>' />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="board" id="board">
      <div class="world" id="world"></div>
    </div>
    <div class="dock-wrapper" id="add">
      <div class="dock-clip">
        <div class="dock" id="dock"></div>
      </div>
    </div>
    <div class="view-toggle" id="viewToggle" role="group" aria-label="Board view">
      <span class="view-toggle-thumb" aria-hidden="true"></span>
      <button
        type="button"
        class="view-toggle-btn"
        data-view="wall"
        aria-pressed="true"
        aria-label="Board view"
      >
        <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
      </button>
      <button
        type="button"
        class="view-toggle-btn"
        data-view="stack"
        aria-pressed="false"
        aria-label="Stack view"
      >
        <span class="material-symbols-outlined" aria-hidden="true">layers</span>
      </button>
    </div>
    <button type="button" class="reset" id="reset">start over</button>

    <details class="peel-lab" id="peelLab" hidden>
      <summary>
        <span class="material-symbols-outlined" aria-hidden="true">tune</span>
        Stack peel lab
      </summary>
      <div class="peel-lab-body">
        <div class="peel-lab-actions">
          <button type="button" id="peelLabTestOut">Peel away</button>
          <button type="button" id="peelLabTestIn">Peel back</button>
          <button type="button" id="peelLabReset">Reset</button>
        </div>
        <fieldset>
          <legend>Flight</legend>
          <label data-key="flyX"><span>fly X %</span><input type="range" min="-200" max="200" step="1" value="-100" /><output></output></label>
          <label data-key="flyY"><span>fly Y %</span><input type="range" min="-250" max="100" step="1" value="-123" /><output></output></label>
          <label data-key="flyScale"><span>scale</span><input type="range" min="1" max="2.5" step="0.05" value="1.3" /><output></output></label>
          <label data-key="ms"><span>duration ms</span><input type="range" min="200" max="2500" step="50" value="1000" /><output></output></label>
        </fieldset>
        <fieldset>
          <legend>Hinge</legend>
          <label data-key="originX"><span>origin X %</span><input type="range" min="0" max="100" step="1" value="12" /><output></output></label>
          <label data-key="originY"><span>origin Y %</span><input type="range" min="0" max="100" step="1" value="10" /><output></output></label>
        </fieldset>
        <fieldset>
          <legend>Distort</legend>
          <label data-key="rx"><span>rotateX deg</span><input type="range" min="0" max="90" step="1" value="59" /><output></output></label>
          <label data-key="sky"><span>skewY deg</span><input type="range" min="-45" max="45" step="1" value="-26" /><output></output></label>
          <label data-key="skx"><span>skewX deg</span><input type="range" min="-45" max="45" step="1" value="6" /><output></output></label>
          <label data-key="rz"><span>rotateZ deg</span><input type="range" min="-45" max="45" step="1" value="16" /><output></output></label>
        </fieldset>
        <fieldset>
          <legend>Corners (clip %)</legend>
          <label data-key="tlX"><span>TL X</span><input type="range" min="-40" max="40" step="1" value="0" /><output></output></label>
          <label data-key="tlY"><span>TL Y</span><input type="range" min="-40" max="40" step="1" value="0" /><output></output></label>
          <label data-key="trX"><span>TR X</span><input type="range" min="60" max="160" step="1" value="100" /><output></output></label>
          <label data-key="trY"><span>TR Y</span><input type="range" min="-40" max="40" step="1" value="0" /><output></output></label>
          <label data-key="brX"><span>BR X</span><input type="range" min="60" max="220" step="1" value="158" /><output></output></label>
          <label data-key="brY"><span>BR Y</span><input type="range" min="60" max="220" step="1" value="148" /><output></output></label>
          <label data-key="blX"><span>BL X</span><input type="range" min="-40" max="40" step="1" value="0" /><output></output></label>
          <label data-key="blY"><span>BL Y</span><input type="range" min="60" max="160" step="1" value="100" /><output></output></label>
        </fieldset>
      </div>
    </details>
  </body>
</html>
